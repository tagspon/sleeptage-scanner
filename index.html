<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLEEPTAGE SCANNER</title>
<style>body{font:16px Arial,sans-serif;background:#fafaf7;color:#20231f;margin:0;padding:20px}main{max-width:500px;margin:auto}h1{font-size:24px}#reader{width:100%;margin:16px 0}button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:10px;background:#d9f36a;font-weight:bold}#return{display:none;background:#20231f;color:white}#status{padding:15px;background:white;border-radius:10px;white-space:pre-wrap}</style>
</head><body><main><h1>SLEEPTAGE / PICCLE</h1><p>11자리 CODE 128 바코드를 비춰주세요.</p><div id="status">카메라 준비 중…</div><div id="reader"></div><button id="retry">카메라 시작 / 다시 스캔</button><button id="return">직원용 화면으로 돌아가기</button></main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let scanner=null,busy=false,starting=false;
const statusEl=document.getElementById('status'),ret=document.getElementById('return'),retry=document.getElementById('retry');
function say(s){statusEl.textContent=s}
async function stop(){const s=scanner;scanner=null;if(s){try{if(s.isScanning)await s.stop()}catch(e){}try{await s.clear()}catch(e){}}}
async function start(){if(starting||scanner)return;starting=true;busy=false;ret.style.display='none';retry.disabled=true;say('카메라 준비 중…');try{
if(!window.Html5Qrcode)throw Error('카메라 라이브러리를 불러오지 못했습니다.');
scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128],verbose:false});
await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:130}},onScan,()=>{});
say('바코드를 비춰주세요.');
}catch(e){say('카메라 실행 실패: '+(e.message||e));await stop()}finally{starting=false;retry.disabled=false}}
async function onScan(value){const barcode=String(value).trim();if(busy||!/^\d{11}$/.test(barcode))return;busy=true;say('바코드 '+barcode+' 인식 완료');await stop();
let delivered=false;
try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'SLEEPTAGE_BARCODE',barcode},'*');delivered=true}}catch(e){}
ret.style.display='block';
if(!delivered){say('원래 직원용 화면과 연결되지 않았습니다. 직원용 화면에서 스캐너를 다시 열어주세요.');return}
say('바코드 전달 완료! 직원용 화면으로 복귀를 시도합니다.\n돌아가지 않으면 아래 버튼을 눌러주세요.');
try{window.opener.focus()}catch(e){}
setTimeout(()=>{try{window.close()}catch(e){}},400);
}
retry.onclick=start;
ret.onclick=()=>{try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return}}catch(e){}say('브라우저에서 자동 전환이 제한되었습니다. 탭 목록에서 기존 직원용 화면을 선택해 주세요.')};
start();
</script></body></html>
