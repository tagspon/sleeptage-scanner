<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLEEPTAGE Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      text-align: center;
    }
    h1 { font-size: 25px; }
    button {
      padding: 15px 24px;
      margin: 10px 5px;
      font-size: 17px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
    }
    #reader {
      max-width: 420px;
      margin: 20px auto;
    }
    #status { margin-top: 20px; }
    #result {
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <h1>SLEEPTAGE SCANNER</h1>
  <p>상품 바코드를 카메라에 비춰 주세요.</p>

  <button id="startBtn" onclick="startScan()">
    카메라 스캔 시작
  </button>

  <button onclick="stopScan()">스캔 중지</button>

  <div id="reader"></div>
  <p id="status">스캔 대기 중</p>
  <div id="result"></div>

<script>
const APP_URL =
  'https://script.google.com/macros/s/AKfycbz62MLi8C68RCkuPLFQ0OPbiuxO8gWugNux44j4wfc6-yfBE2YUHhay--qxQMc4aIdxQA/exec';

let scanner = null;
let running = false;
let processing = false;

async function startScan() {
  if (running || processing) return;

  document.getElementById('status').textContent =
    '카메라를 시작하는 중...';

  try {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ],
      verbose: false
    });

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 250, height: 120 }
      },
      async function(decodedText) {
        if (processing) return;

        const barcode = String(decodedText).trim();

        if (!/^\d{11}$/.test(barcode)) {
          document.getElementById('status').textContent =
            '11자리 숫자 바코드를 비춰 주세요.';
          return;
        }

        processing = true;

        document.getElementById('result').textContent = barcode;
        document.getElementById('status').textContent =
          '인식 성공! SLEEPTAGE로 이동합니다.';

        await stopScan();

        if (window.opener && !window.opener.closed) {
  window.opener.postMessage(
    { type: 'SLEEPTAGE_BARCODE', barcode: barcode },
    '*'
  );
  document.getElementById('status').textContent =
    '바코드 전달 완료! 직원용 화면으로 돌아가 주세요.';
} else {
  document.getElementById('status').textContent =
    '직원용 SLEEPTAGE 화면에서 카메라 스캔 버튼을 눌러 실행해 주세요.';
}
      },
      function() {}
    );

    running = true;
    document.getElementById('status').textContent =
      '바코드를 화면 중앙에 맞춰 주세요.';

  } catch (error) {
    running = false;
    processing = false;
    document.getElementById('status').textContent =
      '카메라 실행 실패: ' + error.message;
  }
}

async function stopScan() {
  if (!scanner) return;

  try {
    await scanner.stop();
  } catch (error) {}

  try {
    scanner.clear();
  } catch (error) {}

  scanner = null;
  running = false;
}
</script>

</body>
</html>
